[project]
name = "lasers"
version = "2.0.1"
description = "New Focus TLB-8800 laser control (USB serial) + GUI widgets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
nicegui = ["nicegui>=2.0"]
pyside = ["PySide6>=6.0"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]
ui = [
  "nicegui>=2.0",
  "PySide6>=6.0",
]

[project.urls]
Repository = "https://github.com/MarKo7s/lasers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "laser" = "." }
packages = [
  "laser",
  "laser.core",
  "laser.core.tlb8800",
  "laser.newfocus",
  "laser.newfocus.tlb8800_utilities",
  "laser.ui",
  "laser.ui.nicegui",
  "laser.ui.pyside",
]

[tool.setuptools.package-data]
"laser" = ["supported_models.json"]
